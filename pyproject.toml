[build-system]
requires = ["setuptools>=61,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "ghitty"
version = "0.1.0"
description = "Recall-first GitHub repository discovery with metadata and code evidence"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["openai==2.48.0"]

[project.scripts]
ghitty = "repo_finder:main"

[tool.setuptools]
py-modules = ["repo_finder"]

